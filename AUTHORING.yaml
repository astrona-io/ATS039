sections:
- id: section-010
  title: Application Delivery
  curriculum_item: Application Delivery
  modules:
  - id: module-01
    title: Build And Release Pipelines
    objectives:
    - Trace source changes through build, checks and artifact publication.
    - Explain what continuous integration checks.
    - Distinguish continuous delivery from continuous deployment.
    - Relate release identity to an immutable artifact.
    outline:
    - Source Changes And Build Evidence
    - Delivery, Deployment And Promotion Decisions
    - CI/CD Tools And Pipeline Definitions
    - Registries, Image Signing And Supply Chain
    - Environments, Promotion And Approvals
    playground: true
    module_lab: true
    diagrams: []
  - id: module-02
    title: GitOps And Deployment Configuration
    objectives:
    - Explain declarative, versioned desired state.
    - Describe pull-based reconciliation and drift correction.
    - Compare Helm templating with Kustomize overlays.
    - Identify what a GitOps controller cannot infer from repository state.
    outline:
    - GitOps Reconciliation And Drift
    - Helm, Kustomize And Configuration Rendering
    - GitOps Principles And Push Versus Pull
    - Argo CD And Flux
    - Repository Layout, Secrets And Environments
    playground: true
    module_lab: true
    diagrams: []
  - id: module-03
    title: Safe Application Releases
    objectives:
    - Explain rolling update behavior and readiness gates.
    - Compare rolling, blue-green and canary strategies.
    - Identify evidence needed to promote or reverse a release.
    - Explain compatibility limits of rollback.
    outline:
    - Rolling Updates And Health Gates
    - Blue-Green, Canary And Release Evidence
    - Recreate, A/B Testing, Shadow And Feature Flags
    - Progressive Delivery Tooling
    - Rollback Limits And Compatible Changes
    playground: true
    module_lab: true
    diagrams: []
  - id: module-04
    title: Helm Charts And Releases
    objectives:
    - Describe the files of a Helm chart and how templates use values.
    - Install, upgrade, inspect and roll back a Helm release.
    - Predict which value wins when several sources set the same key.
    - Explain what chart repositories, dependencies and hooks add.
    outline:
    - Chart Anatomy And Templates
    - Installing, Upgrading And Rolling Back Releases
    - Values, Precedence And Checks
    - Repositories, Dependencies And Hooks
    playground: true
    module_lab: true
    diagrams: []
  - id: module-05
    title: Kustomize Bases, Overlays And Patches
    objectives:
    - Describe the roles of a base, an overlay and a kustomization file.
    - Change an environment with transformers, strategic merge patches and JSON patches.
    - Explain how generators and name suffix hashes trigger rollouts.
    - Review a Kustomize result before applying it.
    outline:
    - Bases And Kustomization Files
    - Overlays And Patches
    - Generators, Name Suffixes And Transformers
    - Components, Review And Choosing A Tool
    playground: true
    module_lab: true
    diagrams: []
  - id: module-06
    title: Configuration And Secrets In Delivery
    objectives:
    - Compare environment variables and mounted files as ways to read configuration.
    - Explain what a Secret protects and what protects it further.
    - Choose a method to deliver secrets with a GitOps workflow.
    - Make a configuration change roll out in a controlled way.
    outline:
    - ConfigMaps And How Pods Read Them
    - Secrets And Their Limits
    - Delivering Secrets Without Putting Them In Git
    - Configuration Rollouts, Immutability And Rotation
    playground: true
    module_lab: true
    diagrams: []
  - id: module-07
    title: Rollout Controls And Disruption Safety
    objectives:
    - Tune maxSurge, maxUnavailable, minReadySeconds and the deadline of a rollout.
    - Explain what a PodDisruptionBudget protects and what it does not.
    - Describe how a pod shuts down and configure it for graceful shutdown.
    - Explain how spreading and capacity limits affect a rollout.
    outline:
    - Rollout Settings Of A Deployment
    - PodDisruptionBudgets And Node Drains
    - Graceful Shutdown
    - Spreading, Capacity And Autoscaling During Rollouts
    playground: true
    module_lab: true
    diagrams: []
  capstone: false
  section_quiz: true
- id: section-020
  title: Debugging
  curriculum_item: Debugging
  modules:
  - id: module-01
    title: Diagnosing Application Failures
    objectives:
    - Distinguish process failure from application response failure.
    - Use logs and termination evidence to form a diagnosis.
    - Relate configuration and dependency access to application behavior.
    - Explain correlation and safe reproduction of a failing request.
    outline:
    - Logs, Exits And Crash Loops
    - Configuration, Dependencies And Request Failures
    - Pod Lifecycle States And Status Reasons
    - Probes And Health Failures
    - Logs And Events At Scale
    playground: true
    module_lab: true
    diagrams: []
  - id: module-02
    title: Debugging Failed Releases
    objectives:
    - Compare intended release identity with observed replicas and artifacts.
    - Relate failed probes to rollout progress.
    - Design a focused reproduce, correct and verify cycle.
    - Choose rollback only when its compatibility requirements hold.
    outline:
    - Intended Versions And Observed Progress
    - Reproduce, Correct And Verify
    - Image And Registry Failures
    - Rollback Decisions And Fix-Forward
    - Post-Release Verification And Incident Notes
    playground: true
    module_lab: true
    diagrams: []
  - id: module-03
    title: Debugging Inside Pods With kubectl
    objectives:
    - Run commands, copy files and forward ports to reach a pod.
    - Attach an ephemeral debug container to a pod that has no shell.
    - Recognise out-of-memory kills and resource limit problems.
    - Diagnose permission and read-only filesystem failures.
    outline:
    - exec, cp And port-forward
    - Ephemeral Containers And kubectl debug
    - Resources, OOM Kills And Limits
    - Files, Permissions And Security Contexts
    playground: true
    module_lab: true
    diagrams: []
  - id: module-04
    title: Debugging Services, DNS And Ingress
    objectives:
    - Find a Service with no endpoints and name the cause.
    - Test name resolution from inside a pod and read CoreDNS state.
    - Recognise when a NetworkPolicy blocks traffic.
    - Trace a request from an Ingress or Gateway to a pod.
    outline:
    - Service Selectors, Endpoints And Ports
    - DNS And CoreDNS
    - NetworkPolicy Blocks
    - Ingress And Gateway Routing
    playground: true
    module_lab: true
    diagrams: []
  - id: module-05
    title: Debugging Scheduling, Storage And Cluster Dependencies
    objectives:
    - Read FailedScheduling events and name the cause.
    - Use taints, tolerations and node selectors to explain placement.
    - Diagnose a PersistentVolumeClaim that stays Pending.
    - Find quota, limit range and node condition problems.
    outline:
    - How The Scheduler Decides
    - Taints, Tolerations And Node Selection
    - PersistentVolumeClaims And Storage
    - Quotas, Limit Ranges And Node Conditions
    playground: true
    module_lab: true
    diagrams: []
  - id: module-06
    title: Debugging Helm And GitOps Delivery Failures
    objectives:
    - Read Helm release status, history and failure messages.
    - Render a chart locally to find a template or values fault.
    - Tell sync status from health and find drift in a GitOps tool.
    - Roll back safely and record what failed.
    outline:
    - Failed Helm Releases And History
    - Chart Rendering And Values Problems
    - GitOps Sync, Health And Drift
    - Rollback And Recovery
    playground: true
    module_lab: true
    diagrams: []
  capstone: false
  section_quiz: true
