# Course manifest. One entry per section under `modules:`. Each section lists,
# in order: its README, then for each module the landing page (course.md), its
# parts (course-0N-*.md), the lab's question.md reading and the `type: lab`
# entry after the last part, and the module summary. The section capstone and
# the knowledge check close the section. Playgrounds are not listed: the
# landing page's playground marker shows them. solution.md is never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS039
  title: 'KCNA: Cloud Native Application Delivery'
  description: 'Training material covering the KCNA Cloud Native Application Delivery domain: build and release pipelines, GitOps and deployment configuration with Helm and Kustomize, safe application releases (rolling, blue-green, canary), and debugging application failures and failed releases. Each module pairs a layered reader with an ungraded playground and a graded lab. Each section closes with a capstone and a knowledge check. Targets Kubernetes 1.35.'
  certification:
    name: Kubernetes and Cloud Native Associate
    code: KCNA
    provider: CNCF / Linux Foundation
    domain: Cloud Native Application Delivery
    weight: 16
    competencies:
    - Application Delivery
    - Debugging
modules:
