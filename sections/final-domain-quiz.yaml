# Final domain knowledge check across both sections. Listed last in astrona.yaml as a `type: quiz` entry.
---
schema_version: 1
kind: question_bank
id: ats039-domain-review
course_id: ATS039
exam_code: KCNA
status: draft
provenance: Original practice material; not official examination questions.
scope:
  type: domain
  id: domain-review
  title: Cloud Native Application Delivery
questions:
- id: ats039-domain-review-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Relate release identity to an immutable artifact.
  source_readings:
  - sections/section-010/module-01/course-01-source-changes-and-build-evidence.md
  prompt: Staging tested digest A, but production rebuilt the same source into digest
    B. What should a release reviewer question?
  options:
  - id: a
    text: Whether both Pods share a display name.
    explanation: Names are not artifact identity evidence.
  - id: b
    text: Whether CI can ever run automatically.
    explanation: Automation is not the uncertainty in the described promotion.
  - id: c
    text: Whether staging evidence applies to the actual production artifact.
    explanation: A new build can differ even with the same source revision.
  correct_option: c
  explanation: A new build can differ even with the same source revision.
- id: ats039-domain-review-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe pull-based reconciliation and drift correction.
  source_readings:
  - sections/section-010/module-02/course-01-gitops-reconciliation-and-drift.md
  prompt: An emergency live change is undone by the delivery controller. What should
    the team inspect?
  options:
  - id: a
    text: Only the registry image pull policy.
    explanation: Pull policy affects artifact retrieval, not restoration of declarative
      live configuration.
  - id: b
    text: Declared desired state and the controller's drift correction policy.
    explanation: Reconciliation can restore intent from the managed source.
  - id: c
    text: The container image's filesystem layers only.
    explanation: Artifact packaging does not explain the desired replica or configuration
      restoration.
  correct_option: b
  explanation: Reconciliation can restore intent from the managed source.
- id: ats039-domain-review-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Identify evidence needed to promote or reverse a release.
  source_readings:
  - sections/section-010/module-03/course-02-blue-green-canary-and-release-evidence.md
  prompt: A canary has almost no representative requests and no observed errors. Is
    that enough evidence for broad promotion?
  options:
  - id: a
    text: No; exposure and measurements must represent meaningful application behavior.
    explanation: A quiet canary may not exercise the risky paths.
  - id: b
    text: Yes; zero observed failures always proves complete correctness.
    explanation: The sample can be too weak or unrepresentative.
  - id: c
    text: No; canaries are never usable.
    explanation: They can support release decisions when the evidence is suitable.
  correct_option: a
  explanation: A quiet canary may not exercise the risky paths.
- id: ats039-domain-review-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Relate configuration and dependency access to application behavior.
  source_readings:
  - sections/section-020/module-01/course-02-configuration-dependencies-and-request-failures.md
  prompt: After a configuration-source change, application behavior remains unchanged.
    Which distinction should debugging preserve?
  options:
  - id: a
    text: Every source update automatically changes every process input.
    explanation: Delivery and adoption depend on the configuration mechanism.
  - id: b
    text: A Service always reloads the application's settings.
    explanation: Traffic selection does not implement application configuration reload.
  - id: c
    text: Updated source configuration and effective process configuration are separate
      evidence.
    explanation: Environment values or cached settings may still be old.
  correct_option: c
  explanation: Environment values or cached settings may still be old.
- id: ats039-domain-review-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare intended release identity with observed replicas and
    artifacts.
  source_readings:
  - sections/section-020/module-02/course-01-intended-versions-and-observed-progress.md
  prompt: New replicas are healthy, but users still reach the old version through
    a stale route. What area needs correction?
  options:
  - id: a
    text: Node affinity alone.
    explanation: Placement is not the supported cause in this scenario.
  - id: b
    text: The traffic destination and selection configuration.
    explanation: Replica health does not prove that user traffic reaches those replicas.
  - id: c
    text: The build pipeline must rebuild the same artifact indefinitely.
    explanation: Rebuilding does not correct the specified stale route.
  correct_option: b
  explanation: Replica health does not prove that user traffic reaches those replicas.
- id: ats039-domain-review-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose rollback only when its compatibility requirements hold.
  source_readings:
  - sections/section-020/module-02/course-02-reproduce-correct-and-verify.md
  prompt: A rollback is considered after a release changed an external schema. What
    should happen before image reversal?
  options:
  - id: a
    text: Check old-version compatibility with current data and configuration.
    explanation: An earlier Pod template cannot automatically reverse external state.
  - id: b
    text: Assume rollout history contains every database recovery point.
    explanation: It records workload history rather than database backups.
  - id: c
    text: Disable all verification because the previous image once worked.
    explanation: Historical success does not establish current compatibility.
  correct_option: a
  explanation: An earlier Pod template cannot automatically reverse external state.
- id: ats039-domain-review-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Identify Kubernetes-native pipeline tools.
  source_readings:
  - sections/section-010/module-01/course-03-cicd-tools-and-pipeline-definitions.md
  prompt: Which pair of tools defines pipelines as Kubernetes custom resources?
  options:
  - id: a
    text: Jenkins and GitLab CI
    explanation: Not correct. Tekton and Argo Workflows run steps as pods defined
      by custom resources.
  - id: b
    text: Tekton and Argo Workflows
    explanation: Correct. Tekton and Argo Workflows run steps as pods defined by custom
      resources.
  - id: c
    text: GitHub Actions and Flux
    explanation: Not correct. Tekton and Argo Workflows run steps as pods defined
      by custom resources.
  correct_option: b
  explanation: Tekton and Argo Workflows run steps as pods defined by custom resources.
- id: ats039-domain-review-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain what a signature protects.
  source_readings:
  - sections/section-010/module-01/course-04-registries-signing-and-supply-chain.md
  prompt: A pipeline signs the tag latest. Later the tag moves to a new image. What
    can be concluded?
  options:
  - id: a
    text: The new image inherits the signature
    explanation: Not correct. Signatures bind to a digest, not to a moving tag.
  - id: b
    text: The signature belongs to the old digest and does not cover the new image
    explanation: Correct. Signatures bind to a digest, not to a moving tag.
  - id: c
    text: Signatures are removed by the kubelet
    explanation: Not correct. Signatures bind to a digest, not to a moving tag.
  correct_option: b
  explanation: Signatures bind to a digest, not to a moving tag.
- id: ats039-domain-review-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain what promotion moves.
  source_readings:
  - sections/section-010/module-01/course-05-environments-promotion-and-approvals.md
  prompt: Staging passed all checks. What should production receive?
  options:
  - id: a
    text: A new build from the same source
    explanation: Not correct. Only the same artifact makes staging evidence apply.
  - id: b
    text: The same artifact reference with production configuration
    explanation: Correct. Only the same artifact makes staging evidence apply.
  - id: c
    text: The staging ConfigMap unchanged
    explanation: Not correct. Only the same artifact makes staging evidence apply.
  correct_option: b
  explanation: Only the same artifact makes staging evidence apply.
- id: ats039-domain-review-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare push and pull delivery.
  source_readings:
  - sections/section-010/module-02/course-03-gitops-principles-and-push-versus-pull.md
  prompt: In pull delivery, which component holds the cluster credentials?
  options:
  - id: a
    text: The CI pipeline
    explanation: Not correct. The controller runs in the cluster and reads the repository.
  - id: b
    text: The controller inside the cluster
    explanation: Correct. The controller runs in the cluster and reads the repository.
  - id: c
    text: The developer laptop
    explanation: Not correct. The controller runs in the cluster and reads the repository.
  correct_option: b
  explanation: The controller runs in the cluster and reads the repository.
- id: ats039-domain-review-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Interpret Argo CD status.
  source_readings:
  - sections/section-010/module-02/course-04-argo-cd-and-flux.md
  prompt: An application is Synced and Degraded. What does this mean?
  options:
  - id: a
    text: The live state matches Git but the workloads are not healthy
    explanation: Correct. Sync status and health status are separate.
  - id: b
    text: The repository is empty
    explanation: Not correct. Sync status and health status are separate.
  - id: c
    text: The sync is waiting for approval
    explanation: Not correct. Sync status and health status are separate.
  correct_option: a
  explanation: Sync status and health status are separate.
- id: ats039-domain-review-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare environment layouts.
  source_readings:
  - sections/section-010/module-02/course-05-repository-layout-secrets-and-environments.md
  prompt: Why do many teams prefer folders per environment to branches per environment?
  options:
  - id: a
    text: Folders are easier to compare and avoid merges of unrelated changes
    explanation: Correct. A single diff shows the difference between folders.
  - id: b
    text: Branches cannot hold YAML
    explanation: Not correct. A single diff shows the difference between folders.
  - id: c
    text: Folders encrypt Secrets
    explanation: Not correct. A single diff shows the difference between folders.
  correct_option: a
  explanation: A single diff shows the difference between folders.
- id: ats039-domain-review-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose a strategy.
  source_readings:
  - sections/section-010/module-03/course-03-recreate-ab-shadow-and-feature-flags.md
  prompt: Two versions cannot share one database schema at the same time. Which strategy
    fits?
  options:
  - id: a
    text: Canary
    explanation: Not correct. Recreate never runs two versions together.
  - id: b
    text: Recreate
    explanation: Correct. Recreate never runs two versions together.
  - id: c
    text: Shadow
    explanation: Not correct. Recreate never runs two versions together.
  correct_option: b
  explanation: Recreate never runs two versions together.
- id: ats039-domain-review-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: Know the limit of Deployments.
  source_readings:
  - sections/section-010/module-03/course-04-progressive-delivery-tooling.md
  prompt: Which rollout need cannot be met by a plain Deployment?
  options:
  - id: a
    text: Holding at 10 percent traffic until a metric passes
    explanation: Correct. A Deployment has no traffic weights or metric gates.
  - id: b
    text: Replacing pods one by one
    explanation: Not correct. A Deployment has no traffic weights or metric gates.
  - id: c
    text: Keeping a revision history
    explanation: Not correct. A Deployment has no traffic weights or metric gates.
  correct_option: a
  explanation: A Deployment has no traffic weights or metric gates.
- id: ats039-domain-review-q15
  type: single_choice
  difficulty: intermediate
  learning_objective: Know what undo restores.
  source_readings:
  - sections/section-010/module-03/course-05-rollback-limits-and-compatible-changes.md
  prompt: What does kubectl rollout undo restore?
  options:
  - id: a
    text: The pod template of the previous revision
    explanation: Correct. Only the pod template is restored.
  - id: b
    text: The database contents
    explanation: Not correct. Only the pod template is restored.
  - id: c
    text: Changed ConfigMaps
    explanation: Not correct. Only the pod template is restored.
  correct_option: a
  explanation: Only the pod template is restored.
