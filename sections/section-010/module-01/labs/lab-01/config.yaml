# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Promote One Image From Staging To Production (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-039-lab-010-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the staging release of scout in starfleet, nothing in outpost.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the staging release of scout
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: same-image-reference
      description: Production runs the exact image reference of staging
      type: file
      source: validation/validate-image-promoted.sh
      hint: Read the image of the scout Deployment in starfleet and use the same value in outpost. Do not use latest.
    - name: release-annotations-copied
      description: The source revision and build id annotations are copied
      type: file
      source: validation/validate-release-annotations.sh
      hint: Copy release.astrona.io/source-revision and release.astrona.io/build-id from the staging Deployment to the production Deployment.
    - name: production-config
      description: Production reads its own ConfigMap
      type: file
      source: validation/validate-production-config.sh
      hint: Create the ConfigMap scout-config in outpost with PODINFO_UI_MESSAGE=scout-production and read it with envFrom.
    - name: production-available
      description: Two replicas are available and the Service answers
      type: file
      source: validation/validate-production-available.sh
      hint: Run 2 replicas, create the Service scout in outpost and wait for rollout status.
    - name: release-check-job
      description: The Job release-check completed
      type: file
      source: validation/validate-release-check-job.sh
      hint: Create a Job named release-check in outpost that runs curl -f against the scout Service in outpost.

teardown:
  keepCluster: false
