apiVersion: v1
kind: ConfigMap
metadata:
  name: scout-config
  namespace: outpost
data:
  PODINFO_UI_MESSAGE: scout-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: outpost
  labels:
    app: scout
  annotations:
    release.astrona.io/source-revision: 4f2a9c1
    release.astrona.io/build-id: build-1287
    kubernetes.io/change-cause: promoted build-1287 from staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          envFrom:
            - configMapRef:
                name: scout-config
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: scout
  namespace: outpost
spec:
  selector:
    app: scout
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: release-check
  namespace: outpost
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "curl -fsS http://scout.outpost.svc.cluster.local/healthz"]
