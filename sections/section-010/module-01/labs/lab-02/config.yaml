# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Gate And Promote A Release With Evidence (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-039-lab-010-01-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the staging release of scout in starfleet and an empty outpost namespace
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: gate-job
      description: The Job gate-checks completed with two ordered init containers
      type: file
      source: validation/validate-gate-job.sh
      hint: Create the Job with initContainers build-check and smoke-check and wait for it to complete.
    - name: approval-recorded
      description: The staging Deployment carries the approval annotation
      type: file
      source: validation/validate-approval.sh
      hint: Run kubectl annotate on the scout Deployment in starfleet.
    - name: promoted
      description: Production runs the staging image with the copied approval and the promoted-from annotation
      type: file
      source: validation/validate-promotion.sh
      hint: Use the staging image reference and add both annotations to the outpost Deployment.

teardown:
  keepCluster: false
