# Reference solution.
apiVersion: batch/v1
kind: Job
metadata:
  name: gate-checks
  namespace: starfleet
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: build-check
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "echo build ok"]
        - name: smoke-check
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "curl -fsS http://scout.starfleet.svc.cluster.local/healthz"]
      containers:
        - name: report
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "echo gate passed"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: outpost
  labels:
    app: scout
  annotations:
    release.astrona.io/approved-by: release-manager
    release.astrona.io/promoted-from: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
