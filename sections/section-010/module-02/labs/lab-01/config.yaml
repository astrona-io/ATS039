# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Correct Drift And Render With Kustomize (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-039-lab-010-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: a stand-in repository, a drifted scout, an unmanaged Deployment.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the repository ConfigMap, the drifted scout and the unmanaged Deployment
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: live-matches-repository
      description: scout in starfleet matches the repository
      type: file
      source: validation/validate-live-matches-repo.sh
      hint: Read the manifest in the ConfigMap, compare it with kubectl diff and apply it. Do not edit the ConfigMap.
    - name: unmanaged-removed
      description: The Deployment that the repository does not list is removed
      type: file
      source: validation/validate-unmanaged-removed.sh
      hint: Find the Deployment in starfleet that is not in the repository and delete it.
    - name: repository-unchanged
      description: The repository was not edited
      type: file
      source: validation/validate-repo-unchanged.sh
      hint: The repository is the source of truth. Change the cluster, not the ConfigMap.
    - name: kustomize-overlay
      description: scout in outpost is applied from an overlay
      type: file
      source: validation/validate-kustomize-overlay.sh
      hint: Save the base from the ConfigMap, write an overlay with namespace outpost, replicas 2, the image tag 6.15.0 and the label env=production with includeTemplates, then run kubectl apply -k.

teardown:
  keepCluster: false
