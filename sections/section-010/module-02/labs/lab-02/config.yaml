# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Reconcile, Prune And Record A Revision (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-039-lab-010-02-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: a stand-in repository, a drifted relay and a stray Deployment
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: relay-matches
      description: The relay Deployment matches the repository
      type: file
      source: validation/validate-relay-matches.sh
      hint: Apply the relay.yaml key of the ConfigMap with kubectl apply.
    - name: stray-pruned
      description: The Deployment stray is removed
      type: file
      source: validation/validate-stray-pruned.sh
      hint: Delete the Deployment stray in outpost.
    - name: revision-recorded
      description: The synced revision annotation equals the repository revision
      type: file
      source: validation/validate-revision-recorded.sh
      hint: Read the revision key and annotate relay with gitops.astrona.io/synced-revision.
    - name: repo-unchanged
      description: The repository ConfigMap is not edited
      type: file
      source: validation/validate-repo-unchanged.sh
      hint: Change the cluster, not the repository.

teardown:
  keepCluster: false
