# Starting state: a stand-in repository (ConfigMap desired-state in gitops-repo),
# plus a drifted relay and a stray Deployment in outpost.
apiVersion: v1
kind: Namespace
metadata:
  name: gitops-repo
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: desired-state
  namespace: gitops-repo
data:
  revision: 9d3e7b2
  relay.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: relay
      namespace: outpost
      labels:
        app: relay
        app.kubernetes.io/part-of: relay
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: relay
      template:
        metadata:
          labels:
            app: relay
        spec:
          containers:
            - name: relay
              image: ghcr.io/stefanprodan/podinfo:6.15.0
              ports:
                - name: http
                  containerPort: 9898
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: outpost
  labels:
    app: relay
    app.kubernetes.io/part-of: relay
spec:
  replicas: 5
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
        - name: relay
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stray
  namespace: outpost
  labels:
    app: stray
    app.kubernetes.io/part-of: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stray
  template:
    metadata:
      labels:
        app: stray
    spec:
      containers:
        - name: stray
          image: ghcr.io/stefanprodan/podinfo:6.15.0
