# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Switch Blue-Green Traffic And Roll Back A Stuck Release (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-039-lab-010-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: blue and green behind a Service on blue, and a stuck probe rollout.
bootstrap:
  init:
    - name: seed-cluster
      description: Create blue, green, the Service and the stuck probe release
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: service-on-green
      description: The Service scout sends traffic to green
      type: file
      source: validation/validate-service-on-green.sh
      hint: Change the selector label version of the Service scout from blue to green.
    - name: blue-kept
      description: Blue keeps running
      type: file
      source: validation/validate-blue-kept.sh
      hint: Do not scale down or delete scout-blue. It is the way back.
    - name: cutover-recorded
      description: The cutover is recorded on the Service
      type: file
      source: validation/validate-cutover-evidence.sh
      hint: Annotate the Service scout with kubernetes.io/change-cause and mention green.
    - name: probe-rolled-back
      description: probe is rolled back to the previous revision
      type: file
      source: validation/validate-probe-rolled-back.sh
      hint: Use kubectl rollout undo on the Deployment probe and wait for rollout status. Do not delete the Deployment.
    - name: probe-still-serves
      description: shuttle gets HTTP 200 from probe
      type: file
      source: validation/validate-probe-serves.sh
      hint: Check that the probe pods are ready and the Service has endpoints.

teardown:
  keepCluster: false
