# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Fix Probe And Image Failures (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-039-lab-020-01-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: three faulty workloads in outpost: gauge, ledger and harbor
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: gauge-liveness
      description: gauge uses the path /healthz and is available
      type: file
      source: validation/validate-gauge.sh
      hint: Patch livenessProbe.httpGet.path of gauge to /healthz.
    - name: ledger-endpoints
      description: The Service ledger has an endpoint
      type: file
      source: validation/validate-ledger.sh
      hint: Patch readinessProbe.httpGet.path of ledger to /readyz and wait for the rollout.
    - name: harbor-image
      description: harbor runs the corrected image
      type: file
      source: validation/validate-harbor.sh
      hint: Set the image of harbor to curlimages/curl:8.22.0.

teardown:
  keepCluster: false
