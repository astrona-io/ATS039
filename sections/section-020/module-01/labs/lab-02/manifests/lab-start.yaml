# Starting state: three faulty workloads in outpost.
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gauge
  namespace: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gauge
  template:
    metadata:
      labels:
        app: gauge
    spec:
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          livenessProbe:
            httpGet:
              path: /no-such-path
              port: http
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /no-such-path
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: outpost
spec:
  selector:
    app: ledger
  ports:
    - port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor
  namespace: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor
  template:
    metadata:
      labels:
        app: harbor
    spec:
      containers:
        - name: app
          image: curlimages/curl:8.22.999
          command: ["sleep", "3600"]
