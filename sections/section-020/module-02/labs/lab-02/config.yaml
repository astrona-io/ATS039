# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Roll Back An Image Failure And Verify (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-039-lab-020-02-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: relay with a healthy revision and a revision whose image tag does not exist
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: rolled-back
      description: relay runs the good image with two available replicas
      type: file
      source: validation/validate-rollback.sh
      hint: Run kubectl rollout undo on the relay Deployment.
    - name: change-cause
      description: The change cause records the rollback
      type: file
      source: validation/validate-change-cause.sh
      hint: Annotate the Deployment with kubernetes.io/change-cause.
    - name: smoke-test
      description: The smoke test Job completed against the relay Service
      type: file
      source: validation/validate-smoke-test.sh
      hint: Create the Job smoke-test with curl -fsS against the relay Service and wait.

teardown:
  keepCluster: false
