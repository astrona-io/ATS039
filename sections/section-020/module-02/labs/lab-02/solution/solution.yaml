# Reference solution: the smoke test Job. The rollback is done by apply.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test
  namespace: outpost
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "curl -fsS http://relay.outpost.svc.cluster.local/healthz"]
