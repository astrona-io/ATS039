# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Fix A Read-Only Filesystem And Attach A Debug Container Lab (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-039-lab-020-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - busybox:1.37.0

# Starting state: a mill Deployment that cannot write and a sleeper pod
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: mill-running
      description: mill has an emptyDir volume at /data and one available replica
      type: file
      source: validation/01-mill-running.sh
      hint: Mount an emptyDir volume at /data and keep the security context
    - name: hardening-kept
      description: mill keeps the read-only root filesystem
      type: file
      source: validation/02-hardening-kept.sh
      hint: Fix the path with a volume and do not remove the security context
    - name: debug-container
      description: The pod sleeper has an ephemeral container named inspector
      type: file
      source: validation/03-debug-container.sh
      hint: Use kubectl debug with the container name inspector and the target sleeper
    - name: finding
      description: The Deployment mill records the finding in an annotation
      type: file
      source: validation/04-finding.sh
      hint: Annotate the Deployment with debug/finding

teardown:
  keepCluster: false
