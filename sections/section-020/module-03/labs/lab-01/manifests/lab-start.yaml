# Starting state: the outpost namespace, a mill Deployment that cannot write and a sleeper pod.
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mill
  namespace: outpost
  labels:
    app: mill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mill
  template:
    metadata:
      labels:
        app: mill
    spec:
      containers:
        - name: mill
          image: busybox:1.37.0
          command: ["sh", "-c", "echo ready > /data/state && sleep 3600"]
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Pod
metadata:
  name: sleeper
  namespace: outpost
spec:
  containers:
    - name: sleeper
      image: busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
