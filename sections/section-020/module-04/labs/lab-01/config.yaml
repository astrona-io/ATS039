# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Fix A Service With No Endpoints Lab (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-039-lab-020-04
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: a Service with a wrong selector and target port
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: endpoints
      description: The Service web has two endpoint addresses
      type: file
      source: validation/01-endpoints.sh
      hint: Make the selector match the pod labels
    - name: target-port
      description: The Service sends traffic to port 9898
      type: file
      source: validation/02-target-port.sh
      hint: Compare targetPort with the container port
    - name: selector-kept
      description: The Deployment labels are unchanged
      type: file
      source: validation/03-selector-kept.sh
      hint: Fix the Service and do not change the Deployment
    - name: dns-name
      description: The Service records its full DNS name in an annotation
      type: file
      source: validation/04-dns-name.sh
      hint: Annotate the Service with debug/dns

teardown:
  keepCluster: false
