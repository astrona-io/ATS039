# Starting state: web Deployment with a Service that has a wrong selector and a wrong target port.
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: outpost
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - containerPort: 9898
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: outpost
spec:
  selector:
    app: webb
  ports:
    - port: 80
      targetPort: 9999
