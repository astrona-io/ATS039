# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Roll Back A Bad Update And Fix Drift Lab (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-039-lab-020-06
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - busybox:1.37.0

# Starting state: a Deployment with a bad image update and a drifted replica count
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: beacon-available
      description: The Deployment beacon has two available replicas
      type: file
      source: validation/01-beacon-available.sh
      hint: Roll back the bad update
    - name: beacon-image
      description: beacon runs the good image tag
      type: file
      source: validation/02-beacon-image.sh
      hint: Use rollout undo or set the image back to 6.15.0
    - name: ledger-replicas
      description: ledger matches the replica count it declares
      type: file
      source: validation/03-ledger-replicas.sh
      hint: Read the gitops/desired-replicas annotation and scale to it
    - name: finding
      description: The Deployment beacon records the finding in an annotation
      type: file
      source: validation/04-finding.sh
      hint: Annotate the Deployment with debug/finding

teardown:
  keepCluster: false
