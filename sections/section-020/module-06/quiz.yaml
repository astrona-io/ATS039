questions:
- id: ats039-020-06-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Read release state.
  source_readings:
  - sections/section-020/module-06/course-01-failed-helm-releases-and-history.md
  prompt: Which command shows the revisions of a Helm release?
  options:
  - id: a
    text: helm lint
    explanation: Not correct. history lists revisions and descriptions.
  - id: b
    text: helm create
    explanation: Not correct. history lists revisions and descriptions.
  - id: c
    text: helm history
    explanation: Correct. history lists revisions and descriptions.
  correct_option: c
  explanation: history lists revisions and descriptions.
- id: ats039-020-06-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Failed with wait.
  source_readings:
  - sections/section-020/module-06/course-01-failed-helm-releases-and-history.md
  prompt: A release is failed after a timeout with --wait. Where do you look next?
  options:
  - id: a
    text: The chart name
    explanation: Not correct. The wait failed because pods were not ready.
  - id: b
    text: Pod events and logs
    explanation: Correct. The wait failed because pods were not ready.
  - id: c
    text: The Helm version only
    explanation: Not correct. The wait failed because pods were not ready.
  correct_option: b
  explanation: The wait failed because pods were not ready.
- id: ats039-020-06-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Pending upgrade.
  source_readings:
  - sections/section-020/module-06/course-01-failed-helm-releases-and-history.md
  prompt: A release stays pending-upgrade after an interrupted run. What is a safe
    recovery step?
  options:
  - id: a
    text: helm rollback to the last good revision
    explanation: Correct. Rollback creates a new revision with old content.
  - id: b
    text: Delete the release Secrets
    explanation: Not correct. Rollback creates a new revision with old content.
  - id: c
    text: Use --force on every upgrade
    explanation: Not correct. Rollback creates a new revision with old content.
  correct_option: a
  explanation: Rollback creates a new revision with old content.
- id: ats039-020-06-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Render locally.
  source_readings:
  - sections/section-020/module-06/course-02-chart-rendering-and-values-problems.md
  prompt: Which command renders a chart without contacting the cluster?
  options:
  - id: a
    text: helm install
    explanation: Not correct. template prints rendered objects.
  - id: b
    text: helm uninstall
    explanation: Not correct. template prints rendered objects.
  - id: c
    text: helm template
    explanation: Correct. template prints rendered objects.
  correct_option: c
  explanation: template prints rendered objects.
- id: ats039-020-06-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Misspelled value.
  source_readings:
  - sections/section-020/module-06/course-02-chart-rendering-and-values-problems.md
  prompt: A misspelled key in values.yaml causes what?
  options:
  - id: a
    text: An error at once
    explanation: Not correct. Unknown keys are not rejected by default.
  - id: b
    text: It is ignored and the default is used
    explanation: Correct. Unknown keys are not rejected by default.
  - id: c
    text: The release is deleted
    explanation: Not correct. Unknown keys are not rejected by default.
  correct_option: b
  explanation: Unknown keys are not rejected by default.
- id: ats039-020-06-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Server dry run.
  source_readings:
  - sections/section-020/module-06/course-02-chart-rendering-and-values-problems.md
  prompt: Why run a server-side dry run after a local render?
  options:
  - id: a
    text: The server checks API versions and schema
    explanation: Correct. Only the server knows its API and admission rules.
  - id: b
    text: It saves the objects
    explanation: Not correct. Only the server knows its API and admission rules.
  - id: c
    text: It speeds up the install
    explanation: Not correct. Only the server knows its API and admission rules.
  correct_option: a
  explanation: Only the server knows its API and admission rules.
- id: ats039-020-06-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Sync versus health.
  source_readings:
  - sections/section-020/module-06/course-03-gitops-sync-health-and-drift.md
  prompt: An application is Synced and Degraded. What does that mean?
  options:
  - id: a
    text: The repository was not applied
    explanation: Not correct. Sync and health are separate.
  - id: b
    text: The tool is turned off
    explanation: Not correct. Sync and health are separate.
  - id: c
    text: The repository was applied and the objects are not healthy
    explanation: Correct. Sync and health are separate.
  correct_option: c
  explanation: Sync and health are separate.
- id: ats039-020-06-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Drift cause.
  source_readings:
  - sections/section-020/module-06/course-03-gitops-sync-health-and-drift.md
  prompt: A manual change keeps reverting after a few minutes. What is the likely
    cause?
  options:
  - id: a
    text: A full disk
    explanation: Not correct. The tool restores the repository state.
  - id: b
    text: Self-healing in the GitOps tool
    explanation: Correct. The tool restores the repository state.
  - id: c
    text: A DNS error
    explanation: Not correct. The tool restores the repository state.
  correct_option: b
  explanation: The tool restores the repository state.
- id: ats039-020-06-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Fix OutOfSync.
  source_readings:
  - sections/section-020/module-06/course-03-gitops-sync-health-and-drift.md
  prompt: How should you fix an OutOfSync state caused by wrong content?
  options:
  - id: a
    text: Change the repository and sync
    explanation: Correct. The repository is the source of truth.
  - id: b
    text: Edit the live object
    explanation: Not correct. The repository is the source of truth.
  - id: c
    text: Delete the namespace
    explanation: Not correct. The repository is the source of truth.
  correct_option: a
  explanation: The repository is the source of truth.
- id: ats039-020-06-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Rollback limits.
  source_readings:
  - sections/section-020/module-06/course-04-rollback-and-recovery.md
  prompt: What does kubectl rollout undo not restore?
  options:
  - id: a
    text: The container image
    explanation: Not correct. Undo changes the template only.
  - id: b
    text: The pod template
    explanation: Not correct. Undo changes the template only.
  - id: c
    text: Data changed by a database migration
    explanation: Correct. Undo changes the template only.
  correct_option: c
  explanation: Undo changes the template only.
